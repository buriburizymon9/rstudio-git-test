name: Temporary EU ETS data download

on:
  pull_request:
    paths:
      - '.github/workflows/temp-eu-ets-download.yml'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download official 2025 verified emissions workbook
        run: |
          curl -fL --retry 4 --retry-delay 3 \
            'https://climate.ec.europa.eu/document/download/53018483-62b3-499e-9ab9-b4a831cc44f4_en?filename=verified_emissions_2025_en.xlsx' \
            -o verified_emissions_2025_en.xlsx
          file verified_emissions_2025_en.xlsx
          test -s verified_emissions_2025_en.xlsx
      - name: Upload workbook artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-emissions-2025
          path: verified_emissions_2025_en.xlsx
